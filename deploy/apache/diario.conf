# Diario — https://diario.raspi.lan
# Sitio estático generado por Hugo en /var/www/diario, protegido con usuario y contraseña.
# La contraseña NO está en el repositorio: se crea en la Raspberry con
#   sudo htpasswd -c /etc/apache2/diario.htpasswd <usuario>

<VirtualHost *:80>
	ServerName diario.raspi.lan
	Redirect permanent / https://diario.raspi.lan/
</VirtualHost>

<VirtualHost *:443>
	ServerName diario.raspi.lan
	DocumentRoot /var/www/diario

	SSLEngine on
	SSLCertificateFile    /etc/ssl/raspi-lab/raspi.lan.crt
	SSLCertificateKeyFile /etc/ssl/raspi-lab/raspi.lan.key

	<Directory /var/www/diario>
		Options -Indexes
		AllowOverride None

		AuthType Basic
		AuthName "Diario"
		AuthUserFile /etc/apache2/diario.htpasswd
		Require valid-user
	</Directory>

	Header always set X-Robots-Tag "noindex, nofollow"
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "no-referrer"

	ErrorLog ${APACHE_LOG_DIR}/diario-error.log
	CustomLog ${APACHE_LOG_DIR}/diario-access.log combined
</VirtualHost>
