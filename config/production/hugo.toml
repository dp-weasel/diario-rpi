# Entorno de producción (hugo build en la Raspberry).
#
# >>> RUTA DE LAS ENTRADAS DEL DIARIO <<<
# Cambiar "source" del segundo montaje si la carpeta del diario se mueve.
#
# Al definir montajes de "content" se reemplaza el montaje por defecto, así que:
#   1) del content/ del repo solo se toman las portadas (_index.md), no las entradas de prueba;
#   2) las entradas reales se montan como content/entradas/.

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["_index.md", "entradas/_index.md"]

[[module.mounts]]
  source = "/home/weasel/Documentos/dp"
  target = "content/entradas"
