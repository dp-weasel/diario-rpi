# Configuración común a todos los entornos.
# Los entornos se eligen con --environment (o -e):
#   hugo server  -> development  (config/development/)
#   hugo build   -> production   (config/production/)
#
# Las entradas del diario NO son contenido de Hugo: se montan como archivos crudos
# en assets/diario/ (ver config/<entorno>/module.toml) y las convierte en páginas
# el content adapter content/entradas/_content.gotmpl.

baseURL = "https://diario.raspi.lan/"
title = "Diario"
theme = "PaperMod"
locale = "es"
defaultContentLanguage = "es"
timeZone = "America/Argentina/Buenos_Aires"
enableEmoji = true

disableKinds = ["rss", "sitemap", "robotsTXT"]

# El HTML crudo dentro del Markdown se omite a propósito (markup.goldmark.renderer.unsafe = false);
# no hace falta avisarlo en cada build.
ignoreLogs = ['warning-goldmark-raw-html']

[module]
  [module.hugoVersion]
    min = "0.168.0"

# Solo etiquetas (sin categorías ni series).
[taxonomies]
  tag = "tags"

# URL de cada entrada: /2026/11/09/
[permalinks]
  [permalinks.page]
    entradas = "/:year/:month/:day/"

# La portada genera además index.json: el índice de la búsqueda.
[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = false          # no se interpreta HTML crudo dentro del Markdown
  [markup.highlight]
    noClasses = false       # PaperMod trae sus propios estilos de código

# --- PaperMod --------------------------------------------------------------
[params]
  defaultTheme = "auto"         # claro/oscuro según el sistema, con botón para cambiar
  mainSections = ["entradas"]
  ShowReadingTime = false
  hideMeta = true               # sin la línea "fecha · tiempo de lectura": el título ya es la fecha
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowBreadCrumbs = false
  ShowRssButtonInSectionTermList = false
  disableSpecial1stPost = true
  ShowAllPagesInArchive = false
  [params.fuseOpts]             # búsqueda: título, texto y etiquetas
    isCaseSensitive = false
    shouldSort = true
    ignoreLocation = true
    threshold = 0.3
    minMatchCharLength = 2
    keys = ["title", "content", "tags"]

[menus]
  [[menus.main]]
    name = "Archivo"
    pageRef = "/archivo"
    weight = 10
  [[menus.main]]
    name = "Etiquetas"
    pageRef = "/tags"
    weight = 20
  [[menus.main]]
    name = "Buscar"
    pageRef = "/buscar"
    weight = 30
